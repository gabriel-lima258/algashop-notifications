spring:
  kafka:
    properties:
      # mesmo alias do development-env: teste e dev resolvem o __TypeId__ igual
      spring.json.type.mapping:
        Notifications.SendEmailCommand:com.algaworks.algashop.notifications.application.email.command.SendEmailIntegrationCommand
  datasource:
    url: jdbc:postgresql://localhost:5433/notifications_test
    username: postgres
    password: postgres
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      resourceserver:
        jwt:
          # nos testes de MVC o JwtDecoder e mock; o endereco so precisa existir
          issuer-uri: http://auth.algashop.local:9000

# teste que sobe contexto nao tenta se registrar no Eureka
eureka:
  client:
    enabled: false

algashop:
  notifications:
    mail:
      from: no-reply@algashop.local
